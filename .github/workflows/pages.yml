name: Uygulamayı yayınla (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "resources/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Simge PNG'lerini üret
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          dwebp resources/icon.webp -o /tmp/icon.png
          convert /tmp/icon.png -resize 192x192 web/icons/icon-192.png
          convert /tmp/icon.png -resize 512x512 web/icons/icon-512.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
