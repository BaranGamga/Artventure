name: APK oluştur

# APK yalnızca bir kabuktur: içeriği GitHub Pages'ten yükler.
# Uygulama içeriği güncellendiğinde APK'yi yeniden kurmak gerekmez.
on:
  push:
    branches: [main]
    paths: ["capacitor.config.json", "package.json", "resources/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund
      - name: Android projesini oluştur
        run: npx cap add android
      - name: Simgeleri üret
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          mkdir -p assets
          dwebp resources/icon.webp -o assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:'#3B2266' assets/icon-background.png
          npx capacitor-assets generate --android
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Artventure.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Artventure.apk --title "Artventure APK" --notes "Bu APK'yi bir kez kur. Sonraki güncellemeler uygulama içinden gelir; APK'yi yeniden indirmen gerekmez."
