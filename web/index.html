<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A26" media="(prefers-color-scheme: dark)">
<title>Artventure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="back" type="button" hidden>‹ Geri</button>
    <h1 id="title">Artventure</h1>
    <a class="iconbtn" href="#ayarlar" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a>
  </header>
  <div class="update" id="update" hidden role="status">
    <div><b>Yeni güncelleme hazır</b><div class="sub" id="updNotes"></div></div>
    <div class="row"><button class="btn small" id="updYes" type="button">Güncelle</button><button class="btn ghost small" id="updNo" type="button">Sonra</button></div>
  </div>
  <main id="view" class="view"></main>
</div>

<button class="fab" id="fab" type="button" aria-haspopup="dialog">Usta'ya sor</button>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="ustaT"><div class="box">
  <div class="row"><h2 id="ustaT" style="margin:0;flex:1">Usta</h2><button class="btn ghost small" id="clearChat" type="button">Yeni sohbet</button><button class="btn ghost small" id="closeSheet" type="button">Kapat</button></div>
  <div class="sub" id="ustaCtx"></div>
  <div class="msgs" id="msgs"></div>
  <div class="composer"><textarea id="ask" placeholder="Bir şey sor ya da bugün ne hayal ettiğini anlat…"></textarea><button class="btn" id="send" type="button">Gönder</button></div>
</div></div>

<nav class="tabbar" aria-label="Ana menü"><div class="in">
  <a href="#kesfet" data-tab="kesfet"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z"/></svg><span>Keşfet</span></a>
  <a href="#sanatcilar" data-tab="sanatcilar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Sanatçılar</span></a>
  <a href="#bakis" data-tab="bakis"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Bakış</span></a>
  <a href="#pratik" data-tab="pratik"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><span>Pratik</span></a>
  <a href="#gunluk" data-tab="gunluk"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 8h7M8 12h7"/></svg><span>Günlük</span></a>
</div></nav>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
